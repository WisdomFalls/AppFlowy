<style>
/* Dragon Ball: Mortal Coil
   Dark-first by design: the game is a night sky with a scouter readout over it.
   Bare :root carries the full dark palette; light is the swapped set. */

:root {
  color-scheme: dark;

  --ground: #14121d;
  --ground-2: #1b1826;
  --surface: #221e30;
  --surface-2: #2b2639;
  --line: #3a3349;
  --line-soft: #2f2a3e;

  --ink: #f4eee4;
  --ink-2: #c3b9cd;
  --ink-3: #8f8499;

  --gi: #ff7a1a;
  --gi-soft: #b8541010;
  --ki: #3fd6a4;
  --blood: #ff4d5e;
  --gold: #f5c451;
  --void: #8b7bff;

  --shadow: 0 18px 40px -24px rgba(0, 0, 0, .9);
  --radius: 14px;
  --radius-s: 9px;

  --font-display: 'Anton', 'Arial Narrow', Impact, sans-serif;
  --font-body: 'Newsreader', Georgia, 'Times New Roman', serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  --phone: 500px;
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --ground: #ece5d8;
    --ground-2: #f4efe5;
    --surface: #fffcf6;
    --surface-2: #f7f1e6;
    --line: #d8cdb9;
    --line-soft: #e6ddcd;
    --ink: #241f2b;
    --ink-2: #574d5f;
    --ink-3: #857a8c;
    --gi: #d8560a;
    --gi-soft: #d8560a12;
    --ki: #12876a;
    --blood: #c4283a;
    --gold: #a9781a;
    --void: #5b46d6;
    --shadow: 0 14px 30px -22px rgba(40, 30, 20, .5);
  }
}

:root[data-theme="light"] {
  color-scheme: light;
  --ground: #ece5d8;
  --ground-2: #f4efe5;
  --surface: #fffcf6;
  --surface-2: #f7f1e6;
  --line: #d8cdb9;
  --line-soft: #e6ddcd;
  --ink: #241f2b;
  --ink-2: #574d5f;
  --ink-3: #857a8c;
  --gi: #d8560a;
  --gi-soft: #d8560a12;
  --ki: #12876a;
  --blood: #c4283a;
  --gold: #a9781a;
  --void: #5b46d6;
  --shadow: 0 14px 30px -22px rgba(40, 30, 20, .5);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: none; }
:focus-visible { outline: 2px solid var(--gi); outline-offset: 2px; border-radius: 4px; }

/* ---------------------------------------------------------------- shell */

#app {
  max-width: var(--phone);
  margin: 0 auto;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  background: var(--ground);
  position: relative;
  border-left: 1px solid var(--line-soft);
  border-right: 1px solid var(--line-soft);
}

.screen { display: none; flex-direction: column; flex: 1; min-height: 0; }
.screen.active { display: flex; }

/* ----------------------------------------------------------------- HUD */

.hud {
  position: sticky;
  top: 0;
  z-index: 30;
  background: linear-gradient(var(--ground-2), var(--ground-2) 78%, transparent);
  border-bottom: 1px solid var(--line-soft);
  padding: 10px 14px 12px;
}

.hud-top { display: flex; align-items: baseline; gap: 8px; }
.hud-name {
  font-family: var(--font-display);
  font-size: 21px;
  letter-spacing: .01em;
  text-transform: uppercase;
  line-height: 1;
}
.hud-sub { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-3); letter-spacing: .06em; text-transform: uppercase; }
.hud-spacer { flex: 1; }

.hud-age {
  font-family: var(--font-display);
  font-size: 30px;
  line-height: .9;
  color: var(--gi);
}
.hud-age small { font-family: var(--font-mono); font-size: 9px; color: var(--ink-3); display: block; letter-spacing: .12em; }

.scouter {
  margin-top: 9px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 10px;
  border: 1px solid var(--line);
  border-radius: var(--radius-s);

}
.scouter-label { font-family: var(--font-mono); font-size: 9px; letter-spacing: .14em; color: var(--ink-3); text-transform: uppercase; }
.scouter-value {
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 17px;
  color: var(--ki);
  font-variant-numeric: tabular-nums;
  letter-spacing: -.02em;
}
.scouter-tier { font-family: var(--font-mono); font-size: 10px; color: var(--ink-2); margin-left: auto; text-align: right; }

.bars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-top: 8px; }
.bar-label { font-family: var(--font-mono); font-size: 8.5px; letter-spacing: .1em; color: var(--ink-3); text-transform: uppercase; display: flex; justify-content: space-between; }
.bar-track { height: 4px; background: var(--line-soft); border-radius: 99px; overflow: hidden; margin-top: 3px; }
.bar-fill { height: 100%; border-radius: 99px; transition: width .35s ease; }
.bar-health .bar-fill { background: var(--blood); }
.bar-happy .bar-fill { background: var(--gold); }
.bar-ki .bar-fill { background: var(--ki); }

.pills { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.pill {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: .04em;
  padding: 3px 7px;
  border-radius: 99px;
  border: 1px solid var(--line);
  color: var(--ink-2);
  background: var(--ground);
  white-space: nowrap;
}
.pill b { color: var(--ink); font-weight: 600; }
.pill.good { border-color: color-mix(in srgb, var(--ki) 45%, var(--line)); color: var(--ki); }
.pill.bad { border-color: color-mix(in srgb, var(--blood) 45%, var(--line)); color: var(--blood); }
.pill.gold { border-color: color-mix(in srgb, var(--gold) 45%, var(--line)); color: var(--gold); }

/* ---------------------------------------------------------------- feed */

.feed { flex: 1; overflow-y: auto; padding: 14px 14px 20px; display: flex; flex-direction: column; gap: 12px; }

.year-block { border-left: 2px solid var(--line); padding-left: 12px; }
.year-head {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-bottom: 6px;
  display: flex; gap: 8px; align-items: baseline;
}
.year-head b { color: var(--gi); font-weight: 800; }

.entry { margin-bottom: 10px; }
.entry-title { font-family: var(--font-body); font-weight: 600; font-size: 15.5px; line-height: 1.25; margin-bottom: 2px; text-wrap: balance; }
.entry-text { color: var(--ink-2); font-size: 15px; }
.entry-outcome { font-size: 15px; margin-top: 4px; }
.entry.world .entry-text, .entry.loss .entry-text { color: var(--ink); }
.entry.world { border-left: 2px solid var(--void); padding-left: 9px; margin-left: -2px; }
.entry.death { border-left: 2px solid var(--blood); padding-left: 9px; }
.entry.survival { border-left: 2px solid var(--ki); padding-left: 9px; }
.ai-tag {
  font-family: var(--font-mono); font-size: 8.5px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--void); border: 1px solid color-mix(in srgb, var(--void) 40%, var(--line));
  padding: 1px 5px; border-radius: 99px; margin-left: 6px; vertical-align: 2px;
}

.chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.chip {
  font-family: var(--font-mono); font-size: 10px; padding: 2px 6px; border-radius: 5px;
  background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line-soft);
}
.chip.up { color: var(--ki); }
.chip.down { color: var(--blood); }

.feed-empty { color: var(--ink-3); text-align: center; padding: 40px 20px; font-style: italic; }

/* --------------------------------------------------------------- sheet */

.sheet-scrim {
  position: fixed; inset: 0; background: rgba(8, 6, 14, .62);
  backdrop-filter: blur(2px); z-index: 40; display: none;
}
.sheet-scrim.open { display: block; }

.sheet {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: 0; width: 100%; max-width: var(--phone);
  background: var(--surface); z-index: 50;
  border-radius: 18px 18px 0 0;
  border: 1px solid var(--line);
  border-bottom: none;
  box-shadow: var(--shadow);
  max-height: 88dvh; display: none; flex-direction: column;
}
.sheet.open { display: flex; animation: rise .26s cubic-bezier(.2, .8, .3, 1); }
@keyframes rise { from { transform: translate(-50%, 22px); opacity: .4; } to { transform: translate(-50%, 0); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet.open { animation: none; } .bar-fill { transition: none; } }

.sheet-grab { width: 34px; height: 4px; border-radius: 99px; background: var(--line); margin: 9px auto 4px; flex: none; }
.sheet-body { overflow-y: auto; padding: 6px 18px 14px; }
.sheet-foot { padding: 10px 14px calc(14px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line-soft); display: flex; flex-direction: column; gap: 7px; flex: none; }

.event-kicker { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--gi); }
.event-title {
  font-family: var(--font-display); font-size: 26px; line-height: 1.02;
  text-transform: uppercase; letter-spacing: .005em; margin: 5px 0 9px; text-wrap: balance;
}
.event-text { font-size: 16.5px; line-height: 1.5; }
.event-note { margin-top: 10px; padding: 9px 11px; border-radius: var(--radius-s); background: var(--ground-2); border: 1px solid var(--line-soft); font-size: 14px; color: var(--ink-2); }

.choice {
  display: block; width: 100%; text-align: left;
  padding: 11px 13px; border-radius: var(--radius-s);
  border: 1px solid var(--line); background: var(--ground-2);
  transition: border-color .15s ease, background .15s ease;
}
.choice:hover:not(:disabled) { border-color: var(--gi); background: var(--surface-2); }
.choice:disabled { opacity: .42; cursor: not-allowed; }
.choice-label { font-weight: 600; font-size: 15.5px; line-height: 1.25; }
.choice-hint { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-3); margin-top: 3px; line-height: 1.4; }
.choice.danger { border-color: color-mix(in srgb, var(--blood) 40%, var(--line)); }
.choice.danger .choice-label { color: var(--blood); }
.choice.ai { border-style: dashed; border-color: color-mix(in srgb, var(--void) 50%, var(--line)); }
.choice.ai .choice-label { color: var(--void); }

/* ----------------------------------------------------------------- dock */

.dock {
  position: sticky; bottom: 0; z-index: 25;
  background: var(--ground-2);
  border-top: 1px solid var(--line-soft);
  padding: 9px 12px calc(9px + env(safe-area-inset-bottom));
  display: flex; align-items: center; gap: 8px;
}

.age-btn {
  flex: 1; padding: 13px 14px; border-radius: 12px;
  background: var(--gi); color: #17110a;
  font-family: var(--font-display); font-size: 19px; letter-spacing: .04em;
  text-transform: uppercase; line-height: 1;
  border: 1px solid color-mix(in srgb, var(--gi) 70%, #000);
  transition: transform .1s ease, filter .15s ease;
}
.age-btn:hover { filter: brightness(1.08); }
.age-btn:active { transform: translateY(1px); }
.age-btn.dead { background: var(--blood); color: #fff; }

.tabs { display: flex; gap: 4px; }
.tab-btn {
  width: 46px; padding: 8px 0; border-radius: 10px;
  border: 1px solid var(--line); background: var(--ground);
  font-family: var(--font-mono); font-size: 8.5px; letter-spacing: .06em;
  text-transform: uppercase; color: var(--ink-3);
  display: flex; flex-direction: column; align-items: center; gap: 3px;
}
.tab-btn span { font-size: 15px; line-height: 1; }
.tab-btn.active, .tab-btn:hover { border-color: var(--gi); color: var(--gi); }

/* ---------------------------------------------------------------- lists */

.panel-head { display: flex; align-items: baseline; gap: 8px; margin: 2px 0 10px; }
.panel-title { font-family: var(--font-display); font-size: 22px; text-transform: uppercase; line-height: 1; }
.panel-sub { font-family: var(--font-mono); font-size: 10px; color: var(--ink-3); letter-spacing: .08em; text-transform: uppercase; }

.group-label {
  font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .16em;
  text-transform: uppercase; color: var(--ink-3);
  margin: 16px 0 7px; padding-bottom: 4px; border-bottom: 1px solid var(--line-soft);
}
.group-label:first-child { margin-top: 4px; }

.row {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 10px 11px; border-radius: var(--radius-s);
  border: 1px solid var(--line-soft); background: var(--ground-2);
  text-align: left; margin-bottom: 6px;
}
button.row { transition: border-color .15s ease; }
button.row:hover:not(:disabled) { border-color: var(--gi); }
button.row:disabled { opacity: .4; cursor: not-allowed; }
.row-main { flex: 1; min-width: 0; }
.row-title { font-weight: 600; font-size: 15px; line-height: 1.25; }
.row-note { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-3); margin-top: 2px; line-height: 1.4; }
.row-value { font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; text-align: right; flex: none; }
.row.locked { opacity: .55; }
.row.owned { border-color: color-mix(in srgb, var(--ki) 45%, var(--line)); }
.row.owned .row-title { color: var(--ki); }
.row.danger .row-title { color: var(--blood); }

.bond { width: 54px; flex: none; }
.bond-track { height: 4px; background: var(--line-soft); border-radius: 99px; overflow: hidden; }
.bond-fill { height: 100%; background: var(--gi); }

.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.stat {
  padding: 8px 10px; border-radius: var(--radius-s);
  border: 1px solid var(--line-soft); background: var(--ground-2);
}
.stat-name { font-family: var(--font-mono); font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.stat-val { font-family: var(--font-mono); font-weight: 800; font-size: 17px; font-variant-numeric: tabular-nums; }
.stat-track { height: 3px; background: var(--line-soft); border-radius: 99px; margin-top: 4px; overflow: hidden; }

.memo { font-size: 14.5px; color: var(--ink-2); padding: 7px 0; border-bottom: 1px solid var(--line-soft); }
.memo b { color: var(--ink); font-weight: 600; font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; }

/* -------------------------------------------------------------- creation */

.create { padding: 20px 16px 30px; overflow-y: auto; flex: 1; }
.logo { font-family: var(--font-display); font-size: 38px; line-height: .92; text-transform: uppercase; letter-spacing: .005em; }
.logo em { color: var(--gi); font-style: normal; display: block; }
.tagline { color: var(--ink-2); font-size: 15.5px; margin: 10px 0 20px; max-width: 40ch; }

.field { margin-bottom: 15px; }
.field-label { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); display: block; margin-bottom: 6px; }
.text-input, select.text-input {
  width: 100%; padding: 10px 12px; border-radius: var(--radius-s);
  border: 1px solid var(--line); background: var(--ground-2); color: var(--ink);

}

.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.opt {
  padding: 7px 11px; border-radius: 99px; border: 1px solid var(--line);
  background: var(--ground-2); font-family: var(--font-mono); font-size: 11.5px;
  color: var(--ink-2); transition: all .14s ease;
}
.opt.on { border-color: var(--gi); color: var(--gi); background: var(--gi-soft); }
.opt:hover { border-color: var(--gi); }

.race-card {
  margin-top: 8px; padding: 12px 13px; border-radius: var(--radius-s);
  border: 1px solid var(--line); background: var(--surface);
}
.race-name { font-family: var(--font-display); font-size: 20px; text-transform: uppercase; line-height: 1; }
.race-blurb { font-size: 14.5px; color: var(--ink-2); margin-top: 5px; }
.race-note { font-family: var(--font-mono); font-size: 10.5px; color: var(--gi); margin-top: 7px; line-height: 1.45; }

.primary-btn {
  width: 100%; padding: 14px; border-radius: 12px; margin-top: 8px;
  background: var(--gi); color: #17110a;
  font-family: var(--font-display); font-size: 20px; text-transform: uppercase; letter-spacing: .04em;
  border: 1px solid color-mix(in srgb, var(--gi) 70%, #000);
}
.primary-btn:hover { filter: brightness(1.08); }
.ghost-btn {
  width: 100%; padding: 11px; border-radius: 10px; margin-top: 7px;
  border: 1px solid var(--line); background: var(--ground-2);
  font-family: var(--font-mono); font-size: 12px; letter-spacing: .04em;
  text-transform: uppercase; color: var(--ink-2);
}
.ghost-btn:hover { border-color: var(--gi); color: var(--gi); }
.ghost-btn.danger:hover { border-color: var(--blood); color: var(--blood); }

/* ---------------------------------------------------------------- death */

.epitaph { padding: 24px 18px; overflow-y: auto; flex: 1; }
.epitaph-kicker { font-family: var(--font-mono); font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--blood); }
.epitaph-name { font-family: var(--font-display); font-size: 36px; line-height: .95; text-transform: uppercase; margin: 8px 0 4px; }
.epitaph-dates { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); }
.epitaph-title { color: var(--gold); font-family: var(--font-mono); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; margin-top: 12px; }
.score { font-family: var(--font-display); font-size: 52px; color: var(--gi); line-height: 1; margin: 4px 0 16px; }
.epitaph-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin: 14px 0; }

.spinner {
  display: inline-block; width: 12px; height: 12px; vertical-align: -2px;
  border: 2px solid var(--line); border-top-color: var(--void);
  border-radius: 50%; animation: spin .8s linear infinite; margin-right: 6px;
}
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%);

  padding: 10px 14px; border-radius: 10px;
  background: var(--surface); border: 1px solid var(--line);
  box-shadow: var(--shadow); font-size: 14px; display: none;
}
.toast.show { display: block; }

.hint-text { font-size: 13.5px; color: var(--ink-3); line-height: 1.5; margin-top: 8px; }
.hint-text a { color: var(--gi); }

/* ==== engine/text.js ==== */
const __mod_engine_text_js = (function () {
// Text grammar. Templates are shapes, not sentences.
//
//   {a|b|c}    pick one alternative (nestable)
//   #bank#     pull a phrase from the lexicon (recursively expanded)
//   [slot]     substitute from the context object
//   [slot:cap] substitute and capitalise
//
// Because alternatives nest and banks expand recursively, one template line
// routinely has thousands of distinct renderings.

const { LEXICON } = __mod_data_lexicon_js;

const MAX_DEPTH = 8;

function pickAlt(body, rng) {
  // Split on top-level pipes only, so {a|{b|c}} works.
  const parts = [];
  let depth = 0, current = '';
  for (const ch of body) {
    if (ch === '{') depth++;
    if (ch === '}') depth--;
    if (ch === '|' && depth === 0) {
      parts.push(current);
      current = '';
    } else {
      current += ch;
    }
  }
  parts.push(current);
  return parts[Math.floor(rng.next() * parts.length)];
}

function expandAlts(str, rng, depth) {
  if (depth > MAX_DEPTH || str.indexOf('{') === -1) return str;
  let out = '';
  let i = 0;
  while (i < str.length) {
    if (str[i] === '{') {
      let d = 1, j = i + 1;
      while (j < str.length && d > 0) {
        if (str[j] === '{') d++;
        else if (str[j] === '}') d--;
        if (d > 0) j++;
      }
      const body = str.slice(i + 1, j);
      out += expandAlts(pickAlt(body, rng), rng, depth + 1);
      i = j + 1;
    } else {
      out += str[i++];
    }
  }
  return out;
}

function expandBanks(str, rng, depth, used) {
  if (depth > MAX_DEPTH) return str;
  return str.replace(/#([a-zA-Z_][\w]*)#/g, (whole, key) => {
    const bank = LEXICON[key];
    if (!bank || !bank.length) return whole;
    // Avoid drawing the same phrase twice in one passage; a repeated stock
    // line is the single most obvious tell that text was generated.
    let phrase = bank[Math.floor(rng.next() * bank.length)];
    for (let tries = 0; tries < 4 && used.has(phrase) && bank.length > 1; tries++) {
      phrase = bank[Math.floor(rng.next() * bank.length)];
    }
    used.add(phrase);
    return render(phrase, {}, rng, depth + 1, used);
  });
}

function fillSlots(str, ctx) {
  return str.replace(/\[([\w.]+)(?::(\w+))?\]/g, (whole, path, mod) => {
    let value = ctx;
    for (const part of path.split('.')) {
      if (value == null) break;
      value = value[part];
    }
    if (value === undefined || value === null) return whole;
    let out = String(value);
    if (mod === 'cap') out = out.charAt(0).toUpperCase() + out.slice(1);
    if (mod === 'lower') out = out.toLowerCase();
    if (mod === 'upper') out = out.toUpperCase();
    return out;
  });
}

function render(template, ctx, rng, depth = 0, used) {
  if (!template) return '';
  const seen = used || new Set();
  let s = String(template);
  s = expandAlts(s, rng, depth);
  s = expandBanks(s, rng, depth, seen);
  s = fillSlots(s, ctx);
  // A slot's value can itself be grammar (a template may store '#macguffin#'
  // in a slot), so run one more bounded pass over what was substituted in.
  if (/[#{]/.test(s) && depth < MAX_DEPTH) {
    s = expandAlts(s, rng, depth + 1);
    s = expandBanks(s, rng, depth + 1, seen);
  }
  return depth === 0 ? tidy(s) : s;
}

function tidy(s) {
  let out = s
    .replace(/\s+/g, ' ')
    .replace(/\s+([.,!?;:])/g, '$1')
    .replace(/([.!?])\s*([.!?])+/g, '$1')
    .trim();
  // Sentence case: banks are written as standalone lines, so a phrase spliced
  // mid-passage can land at the start of a sentence.
  out = out.replace(/(^|[.!?]\s+)([a-z])/g, (m, pre, ch) => pre + ch.toUpperCase());
  return out;
}

/** Rough count of distinct renderings a template can produce. */
function variantCount(template) {
  let total = 1;
  let i = 0;
  const s = String(template || '');
  while (i < s.length) {
    if (s[i] === '{') {
      let d = 1, j = i + 1, alts = 1;
      while (j < s.length && d > 0) {
        if (s[j] === '{') d++;
        else if (s[j] === '}') d--;
        else if (s[j] === '|' && d === 1) alts++;
        if (d > 0) j++;
      }
      total *= alts;
      i++;
    } else if (s[i] === '#') {
      const m = /^#([a-zA-Z_][\w]*)#/.exec(s.slice(i));
      if (m && LEXICON[m[1]]) {
        total *= LEXICON[m[1]].length;
        i += m[0].length;
      } else i++;
    } else i++;
  }
  return total;
}

function numberish(n) {
  if (n === undefined || n === null || Number.isNaN(n)) return '0';
  const abs = Math.abs(n);
  if (abs >= 1e15) return (n / 1e15).toFixed(1).replace(/\.0$/, '') + ' quadrillion';
  if (abs >= 1e12) return (n / 1e12).toFixed(1).replace(/\.0$/, '') + ' trillion';
  if (abs >= 1e9) return (n / 1e9).toFixed(1).replace(/\.0$/, '') + ' billion';
  if (abs >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + ' million';
  if (abs >= 1e4) return Math.round(n / 1000) + ',000';
  return Math.round(n).toLocaleString('en-US');
}

function zeni(n) {
  const v = Math.round(n);
  if (Math.abs(v) >= 1e9) return (v / 1e9).toFixed(2).replace(/\.?0+$/, '') + 'B Zeni';
  if (Math.abs(v) >= 1e6) return (v / 1e6).toFixed(2).replace(/\.?0+$/, '') + 'M Zeni';
  return v.toLocaleString('en-US') + ' Zeni';
}

function listPhrase(items, conj = 'and') {
  const a = items.filter(Boolean);
  if (a.length === 0) return '';
  if (a.length === 1) return a[0];
  if (a.length === 2) return `${a[0]} ${conj} ${a[1]}`;
  return `${a.slice(0, -1).join(', ')} ${conj} ${a[a.length - 1]}`;
}

function ordinal(n) {
  const s = ['th', 'st', 'nd', 'rd'];
  const v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

/* ==== engine/memory.js ==== */
const __mod_engine_memory_js = (function () {
// Story memory. Three jobs:
//   1. Suppression - remember the exact shape of what has already happened so
//      the generator stops offering it.
//   2. Facts - durable, queryable statements about this life, so later events
//      can refer back to earlier ones by name.
//   3. Threads - running arcs (a rivalry, a debt, a hunt) that want to advance.

function createMemory() {
  return {
    fingerprints: {},   // shape signature -> year last seen
    templateUse: {},    // template id -> times used
    beatUse: {},        // narrative beat -> times used
    facts: [],
    threads: [],
    recent: [],         // compact recent history, newest last
    nextFactId: 1,
    nextThreadId: 1,
  };
}

/** A signature for "this specific thing, involving these specific people". */
function fingerprint(templateId, slots = {}) {
  const parts = Object.keys(slots)
    .sort()
    .map((k) => `${k}=${String(slots[k]).slice(0, 24)}`);
  return `${templateId}|${parts.join(',')}`;
}

/**
 * Weight multiplier for offering this template again. Recently used shapes are
 * heavily suppressed; heavily used templates decay even when the cast changes.
 */
function noveltyWeight(memory, templateId, slots, year, opts = {}) {
  const fp = fingerprint(templateId, slots);
  const lastExact = memory.fingerprints[fp];
  const uses = memory.templateUse[templateId] || 0;

  let w = 1;
  if (lastExact !== undefined) {
    const gap = year - lastExact;
    if (gap <= 0) w *= 0.001;
    else if (gap < 3) w *= 0.02;
    else if (gap < 8) w *= 0.15;
    else if (gap < 16) w *= 0.55;
    else w *= 0.85;
  } else {
    w *= 1.35;   // never seen this exact shape: prefer it
  }

  // Template fatigue, independent of cast. Steep on purpose: a life sim dies
  // the moment the player recognises a beat they have already seen.
  //
  // Templates whose slots fully determine the scene (which transformation,
  // which technique, which saga) opt out: for those, "the same shape twice" is
  // already caught by the exact-fingerprint check above, and fatiguing them
  // just makes core progression unreachable.
  if (opts.fatigue !== false) w *= 1 / (1 + uses * uses * 0.9);
  else w *= 1 / (1 + uses * 0.12);
  return w;
}

function remember(memory, { templateId, slots, year, title, text, tags }) {
  const fp = fingerprint(templateId, slots);
  memory.fingerprints[fp] = year;
  memory.templateUse[templateId] = (memory.templateUse[templateId] || 0) + 1;
  for (const tag of tags || []) {
    memory.beatUse[tag] = (memory.beatUse[tag] || 0) + 1;
  }
  memory.recent.push({ year, title, text: (text || '').slice(0, 320) });
  if (memory.recent.length > 40) memory.recent.shift();
}

function addFact(memory, fact) {
  const f = {
    id: memory.nextFactId++,
    type: fact.type,
    text: fact.text,
    year: fact.year,
    subject: fact.subject || null,
    object: fact.object || null,
    weight: fact.weight ?? 1,
    tags: fact.tags || [],
  };
  memory.facts.push(f);
  if (memory.facts.length > 220) {
    // Drop the least important old facts, never the heavy ones.
    memory.facts.sort((a, b) => (b.weight - a.weight) || (b.year - a.year));
    memory.facts = memory.facts.slice(0, 200);
    memory.facts.sort((a, b) => a.year - b.year || a.id - b.id);
  }
  return f;
}

function findFacts(memory, filter = {}) {
  return memory.facts.filter((f) => {
    if (filter.type && f.type !== filter.type) return false;
    if (filter.subject && f.subject !== filter.subject) return false;
    if (filter.tag && !f.tags.includes(filter.tag)) return false;
    if (filter.sinceYear !== undefined && f.year < filter.sinceYear) return false;
    return true;
  });
}

function hasFact(memory, type, subject) {
  return memory.facts.some((f) => f.type === type && (subject === undefined || f.subject === subject));
}

// ---------------------------------------------------------------- threads

function openThread(memory, thread) {
  const t = {
    id: memory.nextThreadId++,
    kind: thread.kind,
    subject: thread.subject || null,
    title: thread.title || thread.kind,
    stage: 0,
    maxStage: thread.maxStage ?? 3,
    heat: thread.heat ?? 50,
    openedYear: thread.year,
    lastYear: thread.year,
    data: thread.data || {},
    closed: false,
    outcome: null,
  };
  memory.threads.push(t);
  return t;
}

function activeThreads(memory) {
  return memory.threads.filter((t) => !t.closed);
}

function findThread(memory, kind, subject) {
  return memory.threads.find((t) => !t.closed && t.kind === kind && (subject === undefined || t.subject === subject));
}

function advanceThread(memory, thread, year, heatDelta = 0) {
  thread.stage += 1;
  thread.lastYear = year;
  thread.heat = Math.max(0, Math.min(100, thread.heat + heatDelta));
  if (thread.stage >= thread.maxStage) {
    thread.closed = true;
    thread.outcome = thread.outcome || 'resolved';
  }
  return thread;
}

function closeThread(memory, thread, outcome = 'resolved') {
  thread.closed = true;
  thread.outcome = outcome;
}

/** Threads that have gone quiet want attention; the director uses this. */
function threadPressure(memory, year) {
  return activeThreads(memory).map((t) => ({
    thread: t,
    pressure: (year - t.lastYear) * 8 + t.heat * 0.5,
  })).sort((a, b) => b.pressure - a.pressure);
}

/** Compact narrative context, used for callbacks and for the AI prompt. */
function recallSummary(memory, limit = 10) {
  const facts = memory.facts
    .slice()
    .sort((a, b) => (b.weight - a.weight) || (b.year - a.year))
    .slice(0, limit)
    .map((f) => `Age ${f.year}: ${f.text}`);
  return facts;
}

function recentBeats(memory, limit = 5) {
  return memory.recent.slice(-limit).map((r) => r.title);
}
  return { createMemory, fingerprint, noveltyWeight, remember, addFact, findFacts, hasFact, openThread, activeThreads, findThread, advanceThread, closeThread, threadPressure, recallSummary, recentBeats };
})();

  if (year >= anchors[anchors.length - 1][0]) return anchors[anchors.length - 1][1];

// Power level mathematics. Dragon Ball power is exponential, so growth here is
// multiplicative: a percentage gain per year of training that compounds. That
// reproduces the shape of the series, where a decade of work multiplies you by
// thousands rather than adding a flat amount.

  strength: 'Strength', speed: 'Speed', technique: 'Technique', kiControl: 'Ki Control',
  durability: 'Durability', intellect: 'Intellect', charisma: 'Charisma', discipline: 'Discipline',
};

/** How well the body performs at this age, given the race's aging rate. */
function ageFactor(character) {
  const race = getRace(character.raceId);
  const bio = character.age * race.agingRate;
  if (bio < 4) return 0.25;
  if (bio < 10) return 0.75;
  if (bio < 16) return 1.25;      // childhood spurt: the Gohan effect
  if (bio < 30) return 1.0;
  if (bio < 42) return 0.85;
  if (bio < 55) return 0.62;
  if (bio < 70) return 0.4;
  if (bio < 90) return 0.22;
  return 0.1;
}

  const race = getRace(character.raceId);
  const bio = character.age * race.agingRate;
  if (bio < 35) return 0;
  if (bio < 50) return 0.35;
  if (bio < 65) return 0.9;
  if (bio < 80) return 1.8;
  return 3.0;
}

const CANON_BY_ID = Object.fromEntries(CANON.map((c) => [c.id, c]));

function getCanon(id) {
  return CANON_BY_ID[id];
}

/** Effective combat power of a canon character in a given Age. */
function canonPower(char, year) {
  const keys = Object.keys(char.power).map(Number).sort((a, b) => a - b);
  if (!keys.length) return 1;
  if (year <= keys[0]) return char.power[keys[0]];
  if (year >= keys[keys.length - 1]) return char.power[keys[keys.length - 1]];
  for (let i = 0; i < keys.length - 1; i++) {
    if (year >= keys[i] && year <= keys[i + 1]) {
      const a = keys[i], b = keys[i + 1];
      const t = (year - a) / (b - a);
      // Interpolate in log space; power levels are exponential in this setting.
      const la = Math.log(Math.max(1, char.power[a]));
      const lb = Math.log(Math.max(1, char.power[b]));
      return Math.exp(la + (lb - la) * t);

const __mod_engine_combat_js = (function () {
// Fights. Resolved as a short exchange model rather than a single dice roll, so
// that techniques, transformations and condition all show up in the narration.

const { clamp } = __mod_engine_rng_js;
const { render } = __mod_engine_text_js;
const { combatPower, winChance, zenkaiBoost, bestForm, powerTier } = __mod_engine_stats_js;
const { getTransformation } = __mod_data_transformations_js;
const { TECH_BY_ID } = __mod_data_techniques_js;
const { hasPerk } = __mod_data_races_js;

/** Effective power for a non-player fighter. */
function opponentPower(opponent) {
  return Math.max(1, opponent.power || 1);
}

/**
 * Fight resolution. `opponent` is an NPC-shaped object with a `power`.
 * Returns a structured result the caller turns into prose and consequences.
 */
function fight(state, rng, opponent, opts = {}) {
  const c = state.character;
  const form = opts.form === null ? null : (opts.form !== undefined ? opts.form : bestForm(c));
  const mine = combatPower(c, { form });
  const theirs = opponentPower(opponent) * (opts.opponentMult || 1);

  const rounds = [];
  let myHp = 100 * (c.vitals.health / 100);
  let theirHp = 100;
  let myKi = c.vitals.ki;
  const maxRounds = opts.maxRounds || 6;

  const bigTechs = c.techniques
    .map((id) => TECH_BY_ID[id])
    .filter((t) => t && t.effect && t.effect.atk)
    .sort((a, b) => b.effect.atk - a.effect.atk);

  const edge = Math.log10(Math.max(1, mine) / Math.max(1, theirs));
  let usedSignature = false;

  for (let r = 0; r < maxRounds && myHp > 0 && theirHp > 0; r++) {
    // Each exchange is a contested roll around the power gap, with room for upsets.
    const swing = rng.gauss(edge * 1.6, 1.0);
    const luck = hasPerk(c, 'luck') ? rng.float(0, 0.5) : 0;
    const roll = swing + luck;

    let tech = null;
    if (bigTechs.length && myKi > 12 && rng.chance(0.45)) {
      tech = rng.pick(bigTechs.slice(0, 3));
      myKi -= tech.effect.kiCost || 8;
      if (!usedSignature && c.signature && rng.chance(0.4)) usedSignature = true;
    }

    if (roll > 0.25) {
      const dmg = clamp(18 + roll * 14 + (tech ? tech.effect.atk * 0.35 : 0), 8, 70);
      theirHp -= dmg;
      rounds.push({ side: 'me', tech: tech ? tech.name : null, damage: Math.round(dmg), beat: 'landed' });
    } else if (roll < -0.25) {
      const dmg = clamp(18 - roll * 14, 8, 70);
      myHp -= dmg;
      rounds.push({ side: 'them', damage: Math.round(dmg), beat: 'hit' });
    } else {
      rounds.push({ side: 'even', damage: 0, beat: 'even' });
    }
  }

  let won;
  if (theirHp <= 0 && myHp > 0) won = true;
  else if (myHp <= 0 && theirHp > 0) won = false;
  else won = rng.chance(winChance(mine, theirs));

  const margin = Math.abs(myHp - theirHp);
  const closeCall = margin < 22;
  const damageTaken = clamp(Math.round(100 - myHp), 0, 100);

  // Near-death is the interesting case: it is where Saiyans get stronger.
  const nearDeath = myHp <= 12;
  let zenkai = 0;
  if (nearDeath && !opts.noZenkai) {
    zenkai = zenkaiBoost(c, rng, closeCall ? 1.2 : 0.8);
  }

  const lethal = !won && (myHp <= 0) && rng.chance(opts.lethality ?? 0.22);

  return {
    won, rounds, damageTaken, closeCall, nearDeath, zenkai, lethal,
    myPower: Math.round(mine), theirPower: Math.round(theirs),
    form: form ? form.id : null,
    formName: form ? form.name : null,
    usedSignature,
    kiSpent: Math.max(0, c.vitals.ki - myKi),
    ratio: mine / Math.max(1, theirs),
  };
}

/** Turn a fight result into prose, with variety drawn from the lexicon. */
function narrateFight(result, rng, opponentName) {
  const lines = [];
  if (result.formName) {
    lines.push(render(`{You go|You drop into|You take} ${result.formName} {before the first exchange|the moment it starts|without announcing it}.`, {}, rng));
  }
  const shown = result.rounds.slice(0, 3);
  for (const round of shown) {
    if (round.side === 'me') {
      lines.push(render(round.tech
        ? `You open with ${round.tech} and #landed#.`
        : `{You move first|You do not wait|You close the distance} and #landed#.`, {}, rng));
    } else if (round.side === 'them') {
      lines.push(render(`[foe] #hit#.`, { foe: opponentName }, rng));
    } else {
      lines.push(render(`{Neither of you gives anything away|You trade nothing but distance|The exchange goes nowhere}.`, {}, rng));
    }
  }
  if (result.won) {
    lines.push(render(result.closeCall
      ? `{It is closer than you want to admit|You win it by about a second|Another exchange and it goes the other way}. #aftermath#`
      : `{It is not close|You end it|They do not get up}. #aftermath#`, {}, rng));
  } else {
    lines.push(render(result.nearDeath
      ? `{You wake up later|You come round some time after|The next thing you know}, #injury#.`
      : `{You lose|It goes badly|You are outclassed and you know it}. #injury#.`, {}, rng));
  }
  return lines.join(' ');
}

/**
 * Tournament bracket. Returns the placement and a round-by-round record.
 * Entrants are NPC-shaped objects.
 */
function runTournament(state, rng, entrants, opts = {}) {
  const c = state.character;
  const field = entrants.slice();
  const record = [];
  let round = 1;
  let alive = field.slice();
  let eliminated = false;
  let placement = alive.length + 1;

  while (alive.length > 0 && !eliminated) {
    const foe = alive.shift();
    const res = fight(state, rng, foe, { lethality: opts.lethality ?? 0.04, maxRounds: 5 });
    record.push({ round, foe: foe.name, foePower: foe.power, won: res.won, result: res });
    state.stats.fights++;
    if (res.won) {
      state.stats.wins++;
      round++;
      if (alive.length === 0) {
        placement = 1;
        break;
      }
    } else {
      state.stats.losses++;
      eliminated = true;
      placement = alive.length + 2;
      return { placement, record, won: false, lastResult: res };
    }
  }
  return { placement, record, won: placement === 1, lastResult: record.length ? record[record.length - 1].result : null };
}

/** Build a plausible tournament field for a year and power baseline. */
function buildField(rng, makeFighter, size, baseline) {
  const out = [];
  for (let i = 0; i < size; i++) {
    // Later rounds are exponentially harder.
    const scale = Math.pow(2.6, i - size * 0.45);
    out.push(makeFighter(Math.max(1, baseline * scale * rng.float(0.5, 1.8)), i));
  }
  return out.sort((a, b) => a.power - b.power);
}

function describeGap(mine, theirs) {
  const r = mine / Math.max(1, theirs);
  if (r > 50) return 'They are not remotely in your class.';
  if (r > 6) return 'You are clearly stronger.';
  if (r > 1.5) return 'You have the edge.';
  if (r > 0.66) return 'This is close to even.';
  if (r > 0.16) return 'They are stronger than you.';
  if (r > 0.02) return 'They are far beyond you.';
  return `This is suicide. They are ${powerTier(theirs)}.`;
}
  return { opponentPower, fight, narrateFight, runTournament, buildField, describeGap };
})();

const __mod_engine_progression_js = (function () {
// Transformation gating. Each form declares a requirement object; the custom
// clauses below are the story conditions - a ritual, an absorption, a death -
// that a raw stat check cannot express.

const { TRANSFORMATIONS, ladderFor, getTransformation } = __mod_data_transformations_js;
const { getPlace } = __mod_data_places_js;
const { hasPerk } = __mod_data_races_js;
const { combatPower } = __mod_engine_stats_js;
const { livingNpcs } = __mod_engine_state_js;

const CUSTOM = {
  blutz_wave: (state) => {
    const c = state.character;
    if (!c.tail) return false;
    if (c.flags.power_ball) return true;
    const p = getPlace(c.placeId);
    return ['earth', 'planet_vegeta', 'sadala'].includes(p.planet);
  },
  ssj_hours: (state) => !!state.character.flags.ssj_mastery,
  god_ritual: (state) => !!state.character.flags.god_ritual
    || state.character.mentors.includes('whis') || state.character.mentors.includes('beerus'),
  destroyer_path: (state) => !!state.character.flags.destroyer_training
    || state.character.mentors.includes('beerus'),
  ui_trigger: (state) => !!state.character.flags.ui_trigger,
  namek_fusion: (state) => !!state.character.flags.assimilated,
  dragon_wish_potential: (state) => !!state.character.flags.wish_potential,
  unlock_ritual: (state) => !!state.character.flags.potential_unlocked,
  trained_at_all: (state) => (state.character.flags.hardTrainingYears || 0) >= 3,
  extreme_isolation_training: (state) => !!state.character.flags.isolation_training,
  absorbed_one: (state) => (state.character.flags.absorbed || 0) >= 1,
  absorbed_two: (state) => (state.character.flags.absorbed || 0) >= 2,
  absorbed_three: (state) => (state.character.flags.absorbed || 0) >= 3,
  upgrade_2: (state) => (state.character.flags.upgrades || 0) >= 1,
  upgrade_3: (state) => (state.character.flags.upgrades || 0) >= 2,
  possessed_someone: (state) => !!state.character.flags.possessed,
  has_potara: (state) => state.character.items.includes('potara'),
  has_fusion_partner: (state) => livingNpcs(state).some((n) =>
    n.closeness > 60 && n.power > combatPower(state.character) * 0.4 && n.power < combatPower(state.character) * 2.5),
  wished_for_power: (state) => !!state.character.flags.wished_power,
};

/** Which requirement clauses are unmet, as readable strings. */
function missingRequirements(state, form) {
  const c = state.character;
  const req = form.req || {};
  const missing = [];

  if (req.power && c.power < req.power) missing.push(`power level ${Math.round(req.power).toLocaleString('en-US')}`);
  if (req.parent && !c.transformations.includes(req.parent)) {
    const p = getTransformation(req.parent);
    missing.push(p ? p.name : req.parent);
  }
  for (const [k, v] of Object.entries(req.stat || {})) {
    if ((c.stats[k] || 0) < v) missing.push(`${k} ${v}`);
  }
  for (const f of req.flags || []) if (!c.flags[f]) missing.push(f.replace(/_/g, ' '));
  if (req.anyFlag && !req.anyFlag.some((f) => c.flags[f])) {
    missing.push('a moment strong enough to trigger it');
  }
  for (const t of req.traits || []) {
    if (t === 'tail' && !c.tail) missing.push('a tail');
    else if (t !== 'tail' && !c.traits.includes(t) && !hasPerk(c, t)) missing.push(t);
  }
  for (const m of req.mentors || []) if (!c.mentors.includes(m)) missing.push(`training under ${m.replace(/_/g, ' ')}`);
  for (const t of req.techniques || []) if (!c.techniques.includes(t)) missing.push(t.replace(/_/g, ' '));
  if (req.age && c.age < req.age) missing.push(`age ${req.age}`);
  if (req.custom) {
    const fn = CUSTOM[req.custom];
    if (fn && !fn(state)) missing.push(req.custom.replace(/_/g, ' '));
  }
  return missing;
}

function requirementsMet(state, form) {
  return missingRequirements(state, form).length === 0;
}

/** Forms this character could attempt right now. */
function unlockableForms(state) {
  const c = state.character;
  return ladderFor(c.raceId).filter((f) =>
    !c.transformations.includes(f.id) && requirementsMet(state, f));
}

/** Forms one or two clauses away, for the progression screen. */
function nearbyForms(state, limit = 4) {
  const c = state.character;
  return ladderFor(c.raceId)
    .filter((f) => !c.transformations.includes(f.id))
    .map((f) => ({ form: f, missing: missingRequirements(state, f) }))
    .filter((x) => x.missing.length > 0)
    .sort((a, b) => a.missing.length - b.missing.length || a.form.tier - b.form.tier)
    .slice(0, limit);
}

/** Attempt a transformation. Success is likely but never certain. */
function tryUnlockForm(state, rng, formId) {
  const form = getTransformation(formId);
  const c = state.character;
  if (!form) return { unlocked: false, text: 'Nothing happens.' };
  if (c.transformations.includes(formId)) return { unlocked: false, text: 'You already have this.' };

  const missing = missingRequirements(state, form);
  if (missing.length) {
    return { unlocked: false, text: `Something is still missing: ${missing.slice(0, 2).join(', ')}.`, missing };
  }

  const powerMargin = form.req.power ? c.power / form.req.power : 1.5;
  const chance = Math.min(0.95, 0.42 + Math.log10(Math.max(1, powerMargin)) * 0.35
    + (c.stats.discipline - 50) / 250 + (c.vitals.health - 60) / 400);

  if (rng.chance(chance)) {
    c.transformations.push(formId);
    if (formId === 'ssj') c.flags.went_super = true;
    return { unlocked: true, form, text: `Everything you have goes into one place.` };
  }
  return { unlocked: false, form, text: `You get right up against it.` };
}

function describeRequirement(state, form) {
  const missing = missingRequirements(state, form);
  return missing.length ? `Needs: ${missing.join(', ')}` : 'Available now';
}

/** Every form in the character's ladder, annotated for the UI. */
function ladderStatus(state) {
  const c = state.character;
  return ladderFor(c.raceId).map((f) => ({
    id: f.id, name: f.name, tier: f.tier, mult: f.mult, desc: f.desc, hint: f.hint,
    owned: c.transformations.includes(f.id),
    missing: c.transformations.includes(f.id) ? [] : missingRequirements(state, f),
  }));
}
  return { missingRequirements, requirementsMet, unlockableForms, nearbyForms, tryUnlockForm, describeRequirement, ladderStatus };
})();

    fact(ctx, `Came back from near death stronger. Zenkai.`, { type: 'zenkai', weight: 4, tags: ['saiyan', 'power'] });
  }

}

// ------------------------------------------------------------------ toast

let toastTimer = null;
function flash(message, ms = 2600) {
  const node = $('toast');
  if (!message) return;
  node.textContent = message;
  node.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => node.classList.remove('show'), ms);
}

// --------------------------------------------------------------- creation

function optionRow(container, items, selectedId, onPick) {
  container.innerHTML = '';
  for (const item of items) {
    const b = el('button', 'opt' + (item.id === selectedId ? ' on' : ''), item.name);
    b.type = 'button';
    b.addEventListener('click', () => onPick(item.id));
    container.appendChild(b);
  }
}

function fillSelect(node, values, selected, labelFn) {
  node.innerHTML = '';
  for (const v of values) {
    const o = document.createElement('option');
    o.value = typeof v === 'object' ? v.value : v;
    o.textContent = labelFn ? labelFn(v) : (typeof v === 'object' ? v.label : v);
    if (o.value === String(selected)) o.selected = true;
    node.appendChild(o);
  }
}

// -------------------------------------------------------------------- HUD

function renderHud() {
  const s = characterSummary(GAME);
  const c = GAME.character;
  $('hud-name').textContent = c.name;
  $('hud-sub').textContent = `${s.race} - ${s.place} - Age ${s.year}${c.inAfterlife ? ' - OTHER WORLD' : ''}`;
  $('hud-age').innerHTML = `${c.age}<small>${c.inAfterlife ? 'dead' : 'years'}</small>`;
  $('hud-power').textContent = numberish(s.combat);
  $('hud-tier').textContent = s.tier;

  const setBar = (key, value, max) => {
    const pct = Math.max(0, Math.min(100, (value / max) * 100));
    $('f-' + key).style.width = pct + '%';
    $('v-' + key).textContent = Math.round(value);
  };
  setBar('health', c.vitals.health, 100);
  setBar('happy', c.vitals.happiness, 100);
  setBar('ki', c.vitals.ki, Math.max(1, c.vitals.kiMax));

  const pills = $('hud-pills');
  pills.innerHTML = '';
  const add = (label, value, cls) => {
    const p = el('span', 'pill' + (cls ? ' ' + cls : ''));
    p.innerHTML = `${label} <b>${value}</b>`;
    pills.appendChild(p);
  };
  add('Zeni', zeni(c.zeni).replace(' Zeni', ''));
  add('Fame', Math.round(c.fame));
  add('Karma', Math.round(c.karma), c.karma > 20 ? 'good' : c.karma < -20 ? 'bad' : '');
  if (c.career) add('Job', c.career.title);
  if (c.senzu) add('Senzu', c.senzu, 'good');
  if (GAME.world.dragonBalls) add('Dragon Balls', GAME.world.dragonBalls + '/7', 'gold');
  if (c.transformations.length) add('Forms', c.transformations.length, 'gold');
  if (GAME.legacy) add('Generation', GAME.legacy.generation);
}

function closeSheet() {

function sheetShell(title, kicker) {
  const body = $('sheet-body');
  const foot = $('sheet-foot');
  body.innerHTML = '';
  foot.innerHTML = '';
  const head = el('div', 'panel-head');
  const h = el('div', 'panel-title', title);
  h.id = 'sheet-heading';
  head.appendChild(h);
  if (kicker) head.appendChild(el('div', 'panel-sub', kicker));
  body.appendChild(head);

// ------------------------------------------------------------------ event

function showEvent(event) {
  if (!event) return;
  const body = $('sheet-body');
  const foot = $('sheet-foot');
  body.innerHTML = '';
  foot.innerHTML = '';

  const left = eventsRemaining(GAME);
  const kicker = event.ai
    ? 'Improvised - written just now'
    : `Age ${GAME.character.age}${left > 0 ? ` - ${left} more this year` : ''}`;
  body.appendChild(el('div', 'event-kicker', kicker));
  const title = el('h2', 'event-title', event.title);
  title.id = 'sheet-heading';
  body.appendChild(title);
  body.appendChild(el('p', 'event-text', event.text));

  for (const choice of event.choices) {
    const b = el('button', 'choice' + (choice.danger ? ' danger' : ''));
    b.type = 'button';
    b.disabled = !!choice.locked;
    b.appendChild(el('span', 'choice-label', choice.label));
    if (choice.hint || choice.lockReason) {
      b.appendChild(el('span', 'choice-hint', choice.locked ? choice.lockReason : choice.hint));
    }
    b.addEventListener('click', () => answerEvent(event, choice.id));
    foot.appendChild(b);
  }

  if (AI_MODE !== 'off' && backendName() !== 'none' && !event.ai) {
    const b = el('button', 'choice ai');
    b.type = 'button';
    b.appendChild(el('span', 'choice-label', 'Something else happens instead'));
    b.appendChild(el('span', 'choice-hint', 'Ask Claude to write a different event for this year'));
    b.addEventListener('click', () => requestAiEvent(true));
    foot.appendChild(b);
  }

  openSheet('event');
}

function answerEvent(event, choiceId) {
  const next = choose(GAME, choiceId);
  renderHud();
  renderFeed();
  maybeNarrate(event);

  if (!GAME.character.alive) {
    closeSheet();
    showDeath();
    return;
  }
  if (next) {
    showEvent(next);
  } else {
    closeSheet();
    autosave();
  }
}

async function maybeNarrate(event) {
  if (AI_MODE !== 'always' || backendName() === 'none' || event.ai) return;
  const last = GAME.turn && GAME.turn.entries.slice().reverse().find((e2) => e2.kind === 'event');
  if (!last || !last.outcome) return;
  const rewritten = await narrateOutcome(GAME, event, last.outcome);
  if (rewritten && rewritten !== last.outcome) {
    renarrateLast(GAME, rewritten);
    renderFeed();
  }
}

// --------------------------------------------------------------- age flow

async function ageUp() {
  if (!GAME) return;
  if (!GAME.character.alive) { showDeath(); return; }

  const event = startYear(GAME);
  renderHud();
  renderFeed();

  if (!GAME.character.alive) { showDeath(); return; }

  const wantsAi = AI_MODE !== 'off' && backendName() !== 'none'
    && (AI_MODE === 'always' || Math.random() < 0.45);

  if (event) showEvent(event);
  else { autosave(); }

  if (wantsAi) requestAiEvent(false);
}

async function requestAiEvent(replace) {
  if (AI_BUSY) return;
  if (!GAME.turn || GAME.turn.done) return;
  AI_BUSY = true;

  if (replace) {
    const foot = $('sheet-foot');
    foot.innerHTML = '';
    const note = el('div', 'choice ai');
    note.innerHTML = '<span class="choice-label"><span class="spinner"></span>Claude is writing this year</span>'
      + '<span class="choice-hint">Usually five to thirty seconds.</span>';
    foot.appendChild(note);
  }

  const result = await improviseEvent(GAME, {});
  AI_BUSY = false;

  if (!result || result.error) {
    const copy = result ? errorCopy(result.code) : '';
    if (copy) flash(copy);
    const fallback = currentEvent(GAME);
    if (replace && fallback) showEvent(fallback);
    return;
  }

  if (replace) {
    // Drop the procedural event this one is standing in for.
    GAME.turn.queue.splice(GAME.turn.index, 1, result);
    showEvent(result);
  } else {
    insertEvent(GAME, result);
    // Only take over the screen if nothing is currently being read.
    if (SHEET_MODE !== 'event') {
      const now = currentEvent(GAME);
      if (now) showEvent(now);
    }
  }
}

// ---------------------------------------------------------------- panels

function panelActivities() {
  const { body } = sheetShell('Activities', `Age ${GAME.character.age}`);
  const groups = { body: 'Body', mind: 'Mind', power: 'Power', social: 'People', world: 'World' };
  const actions = availableActions(GAME);

  for (const [key, label] of Object.entries(groups)) {
    const inGroup = actions.filter((a) => a.cat === key);
    if (!inGroup.length) continue;
    body.appendChild(el('div', 'group-label', label));
    for (const action of inGroup) {
      const b = el('button', 'row' + (action.danger ? ' danger' : ''));
      b.type = 'button';
      const main = el('div', 'row-main');
      main.appendChild(el('div', 'row-title', action.name));
      main.appendChild(el('div', 'row-note', action.desc));
      b.appendChild(main);
      b.appendChild(el('div', 'row-value', action.cost || ''));
      b.addEventListener('click', () => {
        const options = actionOptions(GAME, action.id);
        if (options && options.length) chooseActionTarget(action, options);
        else doAction(action.id, {});
      });
      body.appendChild(b);
    }
  }
  openSheet('panel');
}

function chooseActionTarget(action, options) {
  const { body } = sheetShell(action.name, 'Pick one');
  body.appendChild(el('p', 'row-note', action.desc));
  for (const option of options) {
    const b = el('button', 'row');
    b.type = 'button';
    b.disabled = !!option.disabled;
    const main = el('div', 'row-main');
    main.appendChild(el('div', 'row-title', option.label));
    if (option.hint) main.appendChild(el('div', 'row-note', option.hint));
    b.appendChild(main);
    b.addEventListener('click', () => doAction(action.id, { option: option.id }));
    body.appendChild(b);
  }
  const back = el('button', 'ghost-btn', 'Back');
  back.type = 'button';
  back.addEventListener('click', panelActivities);
  body.appendChild(back);
  openSheet('panel');
}

function doAction(actionId, params) {
  const rng = getRng(GAME);
  const result = runAction(GAME, rng, actionId, params);
  saveRng(GAME, rng);

  const entry = { kind: 'event', title: null, text: result.text };
  if (result.gained) entry.text += ` Power level up ${numberish(result.gained)}.`;
  if (result.unlocked) entry.text += ` ${result.unlocked} unlocked.`;

  if (!GAME.log.length || GAME.log[GAME.log.length - 1].age !== GAME.character.age) {
    GAME.log.push({ year: currentYear(GAME), age: GAME.character.age, entries: [] });
  }
  GAME.log[GAME.log.length - 1].entries.push(entry);

  if (GAME.character.vitals.health <= 0 && result.lethal) {
    GAME.character.alive = false;
    GAME.character.death = { cause: 'Killed doing something reckless', year: currentYear(GAME), age: GAME.character.age };
  }

  renderHud();
  renderFeed();
  autosave();

  if (!GAME.character.alive) { closeSheet(); showDeath(); return; }
  panelActivities();
  flash(result.text.slice(0, 140));
}

function panelPeople() {
  const { body } = sheetShell('People', `${livingNpcs(GAME).length} alive`);
  const people = livingNpcs(GAME).sort((a, b) => bondScore(b) - bondScore(a));
  const dead = Object.values(GAME.npcs).filter((n) => !n.alive);

  if (!people.length) body.appendChild(el('p', 'row-note', 'Nobody yet. Age up and meet somebody.'));

  const groups = [
    ['Family', (n) => ['parent', 'sibling', 'child', 'spouse'].includes(n.relation)],
    ['Close', (n) => ['friend', 'bestfriend', 'lover', 'mentor', 'student'].includes(n.relation)],
    ['Bad blood', (n) => ['rival', 'nemesis', 'enemy'].includes(n.relation)],
    ['Everyone else', (n) => !['parent', 'sibling', 'child', 'spouse', 'friend', 'bestfriend', 'lover', 'mentor', 'student', 'rival', 'nemesis', 'enemy'].includes(n.relation)],
  ];

  for (const [label, filter] of groups) {
    const set = people.filter(filter);
    if (!set.length) continue;
    body.appendChild(el('div', 'group-label', label));
    for (const npc of set.slice(0, 40)) {
      const row = el('div', 'row');
      const main = el('div', 'row-main');
      const title = el('div', 'row-title', npc.name + (npc.isCanon ? ' ★' : ''));
      main.appendChild(title);
      main.appendChild(el('div', 'row-note',
        `${relationLabel(npc)} - ${getRace(npc.raceId).short}, ${npc.age} - ${numberish(npc.power)}`));
      row.appendChild(main);

      const bond = el('div', 'bond');
      const track = el('div', 'bond-track');
      const fill = el('div', 'bond-fill');
      fill.style.width = Math.max(0, bondScore(npc)) + '%';
      track.appendChild(fill);
      bond.appendChild(track);
      row.appendChild(bond);
      body.appendChild(row);
    }
  }

  if (dead.length) {
    body.appendChild(el('div', 'group-label', 'Gone'));
    for (const npc of dead.slice(0, 20)) {
      const row = el('div', 'row locked');
      const main = el('div', 'row-main');
      main.appendChild(el('div', 'row-title', npc.name));
      main.appendChild(el('div', 'row-note', `${relationLabel(npc)} - ${npc.causeOfDeath || 'died'}`));
      row.appendChild(main);
      body.appendChild(row);
    }
  }
  openSheet('panel');
}

function panelPower() {
  const c = GAME.character;
  const { body } = sheetShell('Power', powerTier(combatPower(c)));

  body.appendChild(el('div', 'group-label', 'Attributes'));
  const grid = el('div', 'stat-grid');
  for (const key of STAT_KEYS) {
    const box = el('div', 'stat');
    box.appendChild(el('div', 'stat-name', STAT_LABELS[key]));
    box.appendChild(el('div', 'stat-val', Math.round(c.stats[key])));
    const track = el('div', 'stat-track');
    const bar = el('div', 'stat-bar');
    bar.style.width = Math.min(100, c.stats[key]) + '%';
    track.appendChild(bar);
    box.appendChild(track);
    grid.appendChild(box);
  }
  body.appendChild(grid);

  body.appendChild(el('div', 'group-label', 'Transformations'));
  const ladder = ladderStatus(GAME);
  if (!ladder.length) body.appendChild(el('p', 'row-note', 'Your species does not transform.'));
  for (const form of ladder) {
    const row = el('div', 'row' + (form.owned ? ' owned' : form.missing.length ? ' locked' : ''));
    const main = el('div', 'row-main');
    main.appendChild(el('div', 'row-title', form.name));
    main.appendChild(el('div', 'row-note', form.owned ? form.desc
      : form.missing.length ? 'Needs ' + form.missing.slice(0, 3).join(', ') : 'Ready to attempt'));
    row.appendChild(main);
    row.appendChild(el('div', 'row-value', 'x' + numberish(form.mult)));
    body.appendChild(row);
  }

  body.appendChild(el('div', 'group-label', 'Techniques'));
  if (!c.techniques.length) body.appendChild(el('p', 'row-note', 'You know nothing worth naming yet.'));
  const byBranch = {};
  for (const id of c.techniques) {
    const tech = TECH_BY_ID[id];
    if (!tech) continue;
    (byBranch[tech.branch] = byBranch[tech.branch] || []).push(tech);
  }
  for (const [branch, list] of Object.entries(byBranch)) {
    const row = el('div', 'row');
    const main = el('div', 'row-main');
    main.appendChild(el('div', 'row-title', BRANCHES[branch].name));
    main.appendChild(el('div', 'row-note', list.map((t) => t.name).join(', ')));
    row.appendChild(main);
    row.appendChild(el('div', 'row-value', String(list.length)));
    body.appendChild(row);
  }
  if (c.signature) {
    body.appendChild(el('div', 'group-label', 'Signature technique'));
    const row = el('div', 'row owned');
    const main = el('div', 'row-main');
    main.appendChild(el('div', 'row-title', c.signature.name));
    main.appendChild(el('div', 'row-note', `Invented at age ${c.signature.year - c.birthYear >= 0 ? c.signature.year - c.birthYear : c.age}. Nobody else has this.`));
    row.appendChild(main);
    body.appendChild(row);
  }

  const near = nearbyForms(GAME, 3);
  if (near.length) {
    body.appendChild(el('div', 'group-label', 'Next'));
    for (const item of near) {
      const row = el('div', 'row locked');
      const main = el('div', 'row-main');
      main.appendChild(el('div', 'row-title', item.form.name));
      main.appendChild(el('div', 'row-note', item.form.hint));
      row.appendChild(main);
      body.appendChild(row);
    }
  }
  openSheet('panel');
}

function panelRecords() {
  const { body } = sheetShell('Life', `Age ${GAME.character.age}`);
  const c = GAME.character;

  body.appendChild(el('div', 'group-label', 'What is remembered'));
  const facts = GAME.memory.facts.slice().sort((a, b) => b.weight - a.weight || b.year - a.year).slice(0, 18);
  if (!facts.length) body.appendChild(el('p', 'row-note', 'Nothing yet.'));
  for (const f of facts) {
    const memo = el('div', 'memo');
    memo.innerHTML = `<b>AGE ${f.year}</b> ${f.text.replace(/[<>]/g, '')}`;
    body.appendChild(memo);
  }

  const threads = GAME.memory.threads.filter((t) => !t.closed);
  if (threads.length) {
    body.appendChild(el('div', 'group-label', 'Running storylines'));
    for (const t of threads) {
      const row = el('div', 'row');
      const main = el('div', 'row-main');
      main.appendChild(el('div', 'row-title', t.title));
      main.appendChild(el('div', 'row-note', `Open since age ${t.openedYear} - stage ${t.stage + 1} of ${t.maxStage}`));
      row.appendChild(main);
      body.appendChild(row);
    }
  }

  if (GAME.world.divergences.length) {
    body.appendChild(el('div', 'group-label', 'History you changed'));
    for (const d of GAME.world.divergences) {
      body.appendChild(el('div', 'memo', `Age ${d.year}: ${d.event.replace(/_/g, ' ')} - ${d.how}`));
    }
  }

  body.appendChild(el('div', 'group-label', 'Record'));
  const stats = [
    ['Fights', GAME.stats.fights], ['Won', GAME.stats.wins], ['Lost', GAME.stats.losses],
    ['Killed', GAME.stats.kills], ['Techniques', c.techniques.length],
    ['Forms', c.transformations.length], ['Tournaments won', GAME.world.tournamentWins],
    ['Zenkai boosts', c.zenkaiCount || 0], ['AI events', GAME.aiCalls || 0],
  ];
  const grid = el('div', 'stat-grid');
  for (const [label, value] of stats) {
    const box = el('div', 'stat');
    box.appendChild(el('div', 'stat-name', label));
    box.appendChild(el('div', 'stat-val', String(value)));
    grid.appendChild(box);
  }
  body.appendChild(grid);

  body.appendChild(el('div', 'group-label', 'Storytelling'));
  const aiRow = el('div', 'row');
  const aiMain = el('div', 'row-main');
  aiMain.appendChild(el('div', 'row-title', 'AI events'));
  aiMain.appendChild(el('div', 'row-note',
    backendName() === 'sample' ? 'Claude is available here and writes events during your life.'
      : backendName() === 'api' ? 'Using your own Anthropic API key.'
        : 'Not connected. The game generates its own events, which is the default way to play.'));
  aiRow.appendChild(aiMain);
  body.appendChild(aiRow);

  const modes = [['off', 'Off'], ['mixed', 'Mixed'], ['always', 'Every year']];
  const modeRow = el('div', 'opts');
  for (const [id, label] of modes) {
    const b = el('button', 'opt' + (AI_MODE === id ? ' on' : ''), label);
    b.type = 'button';
    b.addEventListener('click', () => { AI_MODE = id; panelRecords(); });
    modeRow.appendChild(b);
  }
  body.appendChild(modeRow);

  if (backendName() !== 'sample') {
    const keyField = el('div', 'field');
    keyField.style.marginTop = '10px';
    const input = el('input', 'text-input');
    input.type = 'password';
    input.placeholder = 'Anthropic API key (optional)';
    input.value = getApiKey();
    input.addEventListener('change', () => {
      setApiKey(input.value.trim());
      flash(input.value.trim() ? 'Key saved in this browser only.' : 'Key removed.');
      panelRecords();
    });
    keyField.appendChild(input);
    keyField.appendChild(el('p', 'hint-text',
      'Stored in this browser and sent only to Anthropic. Leave blank to play on the built-in generator.'));
    body.appendChild(keyField);
  }

  body.appendChild(el('div', 'group-label', 'Save'));
  const saveBtn = el('button', 'ghost-btn', 'Save to this browser');
  saveBtn.type = 'button';
  saveBtn.addEventListener('click', () => {
    const res = save(GAME, 'auto');
    flash(res.ok ? 'Saved.' : 'Could not save in this browser.');
  });
  body.appendChild(saveBtn);

  const copyBtn = el('button', 'ghost-btn', 'Copy save code');
  copyBtn.type = 'button';
  copyBtn.addEventListener('click', async () => {
    const code = exportString(GAME);
    try {
      await navigator.clipboard.writeText(code);
      flash('Save code copied to the clipboard.');
    } catch (e) {
      flash('Could not reach the clipboard.');
    }
  });
  body.appendChild(copyBtn);

  const loadBtn = el('button', 'ghost-btn', 'Paste a save code');
  loadBtn.type = 'button';
  loadBtn.addEventListener('click', () => {
    const code = prompt('Paste a save code');
    if (!code) return;
    const loaded = importString(code);
    if (!loaded) { flash('That save code did not parse.'); return; }
    GAME = loaded;
    closeSheet();
    showPlay();
    flash('Life restored.');
  });
  body.appendChild(loadBtn);

  const quitBtn = el('button', 'ghost-btn danger', 'Abandon this life');
  quitBtn.type = 'button';
  quitBtn.addEventListener('click', () => {
    if (!confirm('Abandon this life and start a new one?')) return;
    clearSlot('auto');
    GAME = null;
    closeSheet();
    DRAFT = newDraft();
    renderCreation();
    showScreen('create');
  });
  body.appendChild(quitBtn);

  openSheet('panel');
}

// ------------------------------------------------------------------ death

function showDeath() {
  const info = epitaph(GAME);
  const node = $('epitaph');
  node.innerHTML = '';

  node.appendChild(el('div', 'epitaph-kicker', GAME.character.inAfterlife ? 'Gone for good' : 'Died'));
  node.appendChild(el('h2', 'epitaph-name', info.name));
  node.appendChild(el('div', 'epitaph-dates',
    `${info.race} - age ${info.age} - Age ${info.year} - ${info.cause}`));
  node.appendChild(el('div', 'epitaph-title', info.title));
  node.appendChild(el('div', 'score', info.score.toLocaleString('en-US')));

  const grid = el('div', 'epitaph-grid');
  const cells = [
    ['Power', numberish(info.power)], ['Fame', info.fame], ['Karma', info.karma],
    ['Techniques', info.techniques], ['Forms', info.forms], ['Children', info.children],
  ];
  for (const [label, value] of cells) {
    const box = el('div', 'stat');
    box.appendChild(el('div', 'stat-name', label));
    box.appendChild(el('div', 'stat-val', String(value)));
    grid.appendChild(box);
  }
  node.appendChild(grid);

  node.appendChild(el('div', 'group-label', 'What they are remembered for'));
  for (const line of info.highlights) node.appendChild(el('div', 'memo', line));

  if (!GAME.character.inAfterlife) {
    const b = el('button', 'primary-btn', 'Go to the Other World');
    b.type = 'button';
    b.addEventListener('click', () => {
      enterAfterlife(GAME);
      autosave();
      showPlay();
      flash('Death is a place here. Keep training.');
    });
    node.appendChild(b);
    node.appendChild(el('p', 'hint-text',
      'Dying is not the end in this setting. You can train under King Kai, fight in the Other World tournament, and be wished back if anyone down there cares enough.'));
  }

  const kids = Object.values(GAME.npcs).filter((n) => n.relation === 'child' && n.alive);
  if (kids.length) {
    const b = el('button', 'ghost-btn', `Continue as ${kids[0].name}`);
    b.type = 'button';
    b.addEventListener('click', () => {
      beginLegacy(GAME);
      autosave();
      showPlay();
      flash('A new generation. The world remembers the last one.');
    });
    node.appendChild(b);
  }

  const again = el('button', 'ghost-btn', 'Start a new life');
  again.type = 'button';
  again.addEventListener('click', () => {
    clearSlot('auto');
    GAME = null;
    DRAFT = newDraft();
    renderCreation();
    showScreen('create');
  });
  node.appendChild(again);

  showScreen('death');
}

// ----------------------------------------------------------------- screens

function showScreen(name) {
  document.querySelectorAll('.screen').forEach((s) => s.classList.remove('active'));
  $('screen-' + name).classList.add('active');
}

function showPlay() {
  renderHud();
  renderFeed();
  showScreen('play');
  $('btn-age').textContent = GAME.character.inAfterlife ? 'Another year dead' : 'Age up';
  $('btn-age').classList.toggle('dead', !!GAME.character.inAfterlife);
}

function autosave() {
  save(GAME, 'auto');
}

// -------------------------------------------------------------------- boot

function startGame() {
  readCreationInputs();
  const seed = $('in-seed').value.trim();
  GAME = createGame({
    name: DRAFT.name,
    raceId: DRAFT.raceId,
    sex: DRAFT.sex,
    upbringingId: DRAFT.upbringingId,
    temperamentId: DRAFT.temperamentId,
    bodyId: DRAFT.bodyId,
    hair: DRAFT.hair,
    eyes: DRAFT.eyes,
    marking: DRAFT.marking,
    birthYear: DRAFT.birthYear,
    placeId: DRAFT.placeId,
  }, seed || undefined);
  autosave();
  showPlay();
  flash(`${GAME.character.name} is born on ${getPlace(GAME.character.placeId).name}.`);
}

function wire() {
  $('btn-begin').addEventListener('click', startGame);
  $('btn-random-all').addEventListener('click', () => { DRAFT = newDraft(); renderCreation(); });
  $('btn-reroll-name').addEventListener('click', () => {
    DRAFT.name = generateFullName(new Rng(Date.now() ^ Math.floor(Math.random() * 1e9)), DRAFT.raceId);
    DRAFT.nameTouched = false;
    $('in-name').value = DRAFT.name;
  });
  $('in-name').addEventListener('input', () => { DRAFT.nameTouched = true; });
  $('in-era').addEventListener('change', () => { readCreationInputs(); renderCreation(); });

  $('btn-age').addEventListener('click', ageUp);
  $('scrim').addEventListener('click', () => { if (SHEET_MODE !== 'event') closeSheet(); });

  document.querySelectorAll('.tab-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      if (!GAME) return;
      document.querySelectorAll('.tab-btn').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      const panel = btn.dataset.panel;
      if (panel === 'activities') panelActivities();
      else if (panel === 'people') panelPeople();
      else if (panel === 'power') panelPower();
      else panelRecords();
    });
  });

  document.addEventListener('keydown', (e2) => {
    if (e2.key === 'Escape' && SHEET_MODE && SHEET_MODE !== 'event') closeSheet();
  });
}

async function boot() {
  DRAFT = newDraft();
  renderCreation();
  wire();

  const saved = load('auto');
  if (saved && saved.character) {
    const btn = $('btn-continue');
    btn.hidden = false;
    btn.textContent = `Continue: ${saved.character.name}, age ${saved.character.age}`;
    btn.addEventListener('click', () => {
      GAME = saved;
      showPlay();
    });
  }

  await initSampling();
  const note = $('create-ai-note');
  note.textContent = backendName() === 'sample'
    ? 'Claude is connected here. Events written live by the model appear alongside the generated ones.'
    : 'Runs entirely on its own generator. Add an Anthropic API key under Life to have Claude write events too.';
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
})();

})();

})();
</script>
